<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Karachi</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <div class="header-left">
        <a href="/" class="site-logo">KARACHI, PAKISTAN</a>
      </div>
      <div class="header-right">
        <a href="/login" class="auth-button">Sign In</a>
      </div>
    </header>

    <div class="auth-container">
      <div class="auth-card">
        <h1>Set New Password</h1>
        <p class="auth-subtext">Enter your verification token and your new password.</p>
        <form id="resetForm">
          <label for="token">Reset Token</label>
          <input type="text" id="token" name="token" required placeholder="Paste reset token here">

          <label for="password">New Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="At least 8 chars, uppercase, lowercase, number">

          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">

          <button type="submit" class="btn-primary">Update Password</button>

          <div id="errorMessage" class="error-message"></div>
          <div id="successMessage" class="success-message"></div>
        </form>

        <div class="auth-links">
          <a href="/login">Back to Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/auth.js" defer></script>
</body>
</html>
