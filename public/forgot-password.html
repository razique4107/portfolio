<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Karachi</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <div class="header-left">
        <a href="/" class="site-logo">KARACHI, PAKISTAN</a>
      </div>
      <div class="header-right">
        <a href="/login" class="auth-button">Sign In</a>
      </div>
    </header>

    <div class="auth-container">
      <div class="auth-card">
        <h1>Reset Password</h1>
        <p class="auth-subtext">Enter your account email to receive a password reset token.</p>
        <form id="forgotForm">
          <label for="email">Account Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">

          <button type="submit" class="btn-primary">Send Reset Link</button>

          <div id="errorMessage" class="error-message"></div>
          <div id="successMessage" class="success-message"></div>
        </form>

        <div class="auth-links">
          <a href="/login">Remembered your password? Sign In</a>
          <a href="/register">Create a new account</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/auth.js" defer></script>
</body>
</html>
